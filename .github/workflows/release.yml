name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  EXPECTED_SIGNING_CERT_SHA256: e192f6b0b0df14acc244d11452ac814cbd59153b96aa90ef57b0812c849edae4

jobs:
  release:
    runs-on: ${{ vars.ANDROID_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
      # Gitea runs this on daemon, whose jobs share a 4 GB cap; a separate Kotlin
      # compiler JVM next to the Gradle daemon does not fit.
      - name: Fit Gradle into the runner's memory
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            'kotlin.compiler.execution.strategy=in-process' \
            >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Verify release tag
        run: test "v$(./gradlew -q :app:printVersionName)" = "$GITHUB_REF_NAME"
      - name: Build signed release
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease bundleRelease
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk |
            grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256"
      - name: Generate release notes
        run: ./hack/generate-release-notes.sh release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
